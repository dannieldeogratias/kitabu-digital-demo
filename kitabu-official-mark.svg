<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="title description">
  <title id="title">Kitabu Digital book mark</title>
  <desc id="description">An open book with a solid green left page, a green checkerboard right page, and gold and blue page edges.</desc>
  <defs>
    <clipPath id="right-page">
      <path d="M188 75c35-34 72-47 108-50v129c-39 8-76 29-108 64z"/>
    </clipPath>
    <pattern id="checker" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-3 180 140)">
      <rect width="15" height="15" fill="#07852b"/>
      <rect x="15" y="15" width="15" height="15" fill="#07852b"/>
    </pattern>
  </defs>

  <path d="M29 73v128c55 2 107 22 151 61 44-39 96-59 151-61V73" fill="none" stroke="#148bc8" stroke-width="15" stroke-linejoin="round" stroke-linecap="square"/>
  <path d="M52 57v126c48 5 91 24 128 57 37-33 80-52 128-57V57" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="square"/>
  <path d="M62 50v122c45 7 84 25 118 55 34-30 73-48 118-55V50" fill="none" stroke="#fbbf0b" stroke-width="10" stroke-linejoin="round" stroke-linecap="square"/>

  <path d="M76 24c43 6 79 26 104 62v132c-31-33-66-55-104-65z" fill="#07852b"/>
  <path d="M188 75c35-34 72-47 108-50v129c-39 8-76 29-108 64z" fill="#ffffff"/>
  <rect x="180" y="18" width="126" height="203" fill="url(#checker)" clip-path="url(#right-page)"/>
  <path d="M180 85c3-4 5-7 8-10v143c-3 3-5 6-8 9z" fill="#ffffff"/>
</svg>
